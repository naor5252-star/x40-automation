name: Dreame X40 Shortcut

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "capture = discover ID via MQTT; run-id = start by ID"
        required: true
        default: "capture"
        type: choice
        options:
          - capture
          - list
          - run-id
      shortcut_name:
        description: "Dreame shortcut name"
        required: true
        default: "ניקוי עמוק"
        type: string
      shortcut_id:
        description: "Required only for run-id"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  dreame:
    name: Dreame Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Dreame client
        run: npm install --no-save node-dreame@0.5.0

      - name: Dreame shortcut operation
        env:
          DREAME_EMAIL: ${{ secrets.DREAME_EMAIL }}
          DREAME_PASSWORD: ${{ secrets.DREAME_PASSWORD }}
          DREAME_REGION: ${{ vars.DREAME_REGION || 'sg' }}
          DREAME_DEVICE_DID: ${{ vars.DREAME_DEVICE_DID }}
          DREAME_CAPTURE_SECONDS: ${{ vars.DREAME_CAPTURE_SECONDS || '150' }}
          DREAME_SHORTCUT_NAME: ${{ inputs.shortcut_name }}
          DREAME_SHORTCUT_ID: ${{ inputs.shortcut_id }}
        run: node scripts/dreame.mjs "${{ inputs.mode }}" "${{ inputs.shortcut_name }}" "${{ inputs.shortcut_id }}"
