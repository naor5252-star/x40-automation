name: Dreame X40 Shortcut
run-name: Dreame X40 — ${{ inputs.mode }}

concurrency:
  group: ${{ (inputs.mode == 'smart-run' || inputs.mode == 'stop-and-dock') && 'dreame-x40-cleaning-control' || format('dreame-x40-{0}', github.run_id) }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Dreame / Telegram operation"
        required: true
        default: "capture"
        type: choice
        options:
          - capture
          - map-rooms
          - list
          - run-id
          - smart-run
          - stop-and-dock
          - evening-check
          - telegram-find-chat
          - telegram-test
          - skip-day-notify
          - telegram-flow-test

      primary_mode:
        description: "Primary: shortcut or CleanGenius"
        required: true
        default: "shortcut"
        type: choice
        options:
          - shortcut
          - cleangenius

      shortcut_name:
        description: "Primary shortcut name (when primary_mode=shortcut)"
        required: false
        default: "ניקוי עמוק"
        type: string

      shortcut_id:
        description: "Primary shortcut ID (when primary_mode=shortcut)"
        required: false
        default: ""
        type: string

      clean_genius_rooms:
        description: "CleanGenius room IDs"
        required: false
        default: "2,3,4,7,8"
        type: string

      clean_genius_mode:
        description: "CleanGenius: 1=Routine, 2=Deep"
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "2"

      clean_genius_label:
        description: "Room names for Telegram"
        required: false
        default: "סלון, חדר שינה ראשי 3, חדר שינה ראשי 2, משרד, מסדרון"
        type: string

      fallback_shortcut_name:
        description: "Fallback shortcut name"
        required: false
        default: "שאיבה בלבד"
        type: string

      fallback_shortcut_id:
        description: "Fallback shortcut ID"
        required: false
        default: ""
        type: string

      water_empty_codes:
        description: "Clean-water error codes"
        required: false
        default: "107,116"
        type: string

      callback_url:
        description: "Worker callback URL"
        required: false
        default: ""
        type: string

      callback_token:
        description: "Per-run callback token"
        required: false
        default: ""
        type: string

      ran_today:
        description: "Robot ran/requested today"
        required: false
        default: "false"
        type: string

      fallback_used:
        description: "Fallback was used today"
        required: false
        default: "false"
        type: string

      returned_by:
        description: "Who returned home (naor/wife)"
        required: false
        default: ""
        type: string

      test_delay_seconds:
        description: "Telegram flow test delay between stages (seconds)"
        required: false
        default: "15"
        type: string

permissions:
  contents: read

jobs:
  dreame:
    name: Dreame Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Dreame client
        run: npm install --no-save node-dreame@0.5.0

      - name: Dreame / Telegram operation
        env:
          DREAME_EMAIL: ${{ secrets.DREAME_EMAIL }}
          DREAME_PASSWORD: ${{ secrets.DREAME_PASSWORD }}
          DREAME_REGION: ${{ vars.DREAME_REGION || 'sg' }}
          DREAME_DEVICE_DID: ${{ vars.DREAME_DEVICE_DID }}
          DREAME_CAPTURE_SECONDS: ${{ vars.DREAME_CAPTURE_SECONDS || '150' }}

          DREAME_PRIMARY_MODE: ${{ inputs.primary_mode }}

          DREAME_SHORTCUT_NAME: ${{ inputs.shortcut_name }}
          DREAME_SHORTCUT_ID: ${{ inputs.shortcut_id }}

          DREAME_CLEAN_GENIUS_ROOMS: ${{ inputs.clean_genius_rooms }}
          DREAME_CLEAN_GENIUS_MODE: ${{ inputs.clean_genius_mode }}
          DREAME_CLEAN_GENIUS_LABEL: ${{ inputs.clean_genius_label }}

          DREAME_FALLBACK_SHORTCUT_NAME: ${{ inputs.fallback_shortcut_name }}
          DREAME_FALLBACK_SHORTCUT_ID: ${{ inputs.fallback_shortcut_id }}
          DREAME_WATER_EMPTY_CODES: ${{ inputs.water_empty_codes }}

          DREAME_PRIMARY_GRACE_SECONDS: ${{ vars.DREAME_PRIMARY_GRACE_SECONDS || '12' }}
          DREAME_SMART_RUN_TIMEOUT_SECONDS: ${{ vars.DREAME_SMART_RUN_TIMEOUT_SECONDS || '100' }}
          DREAME_STATUS_DELAY_SECONDS: ${{ vars.DREAME_STATUS_DELAY_SECONDS || '300' }}
          DREAME_RETURNED_BY: ${{ inputs.returned_by }}
          DREAME_CALLBACK_URL: ${{ inputs.callback_url }}
          DREAME_CALLBACK_TOKEN: ${{ inputs.callback_token }}
          DREAME_RAN_TODAY: ${{ inputs.ran_today }}
          DREAME_FALLBACK_USED: ${{ inputs.fallback_used }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_WATCH_SECONDS: ${{ vars.TELEGRAM_WATCH_SECONDS || '75' }}
          TELEGRAM_FLOW_TEST_DELAY_SECONDS: ${{ inputs.test_delay_seconds || '15' }}

        shell: bash
        run: |
          set -e

          MODE="${{ inputs.mode }}"
          SHORTCUT_NAME="${{ inputs.shortcut_name }}"
          SHORTCUT_ID="${{ inputs.shortcut_id }}"

          if [ "$MODE" = "telegram-find-chat" ]; then
            node scripts/telegram.mjs telegram-find-chat
            exit 0
          fi

          if [ "$MODE" = "telegram-test" ]; then
            node scripts/telegram.mjs telegram-test
            exit 0
          fi

          if [ "$MODE" = "skip-day-notify" ]; then
            node scripts/skip-day-notify.mjs
            exit 0
          fi

          if [ "$MODE" = "telegram-flow-test" ]; then
            node scripts/telegram-flow-test.mjs
            exit 0
          fi

          if [ "$MODE" = "map-rooms" ]; then
            node scripts/map-rooms.mjs
            exit 0
          fi

          if [ "$MODE" = "stop-and-dock" ]; then
            node scripts/stop-and-dock.mjs
            exit 0
          fi

          if [ "$MODE" = "evening-check" ]; then
            node scripts/evening-check.mjs
            exit 0
          fi

          if [ "$MODE" = "smart-run" ]; then
            node scripts/smart-run.mjs
            exit 0
          fi

          if [ "$MODE" = "run-id" ]; then
            node scripts/telegram.mjs watch &
            WATCH_PID=$!
            sleep 2
            node scripts/dreame.mjs "$MODE" "$SHORTCUT_NAME" "$SHORTCUT_ID"
            wait "$WATCH_PID" || true
            exit 0
          fi

          node scripts/dreame.mjs "$MODE" "$SHORTCUT_NAME" "$SHORTCUT_ID"
