name: Dreame X40 Shortcut

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Dreame / Telegram operation"
        required: true
        default: "capture"
        type: choice
        options:
          - capture
          - list
          - run-id
          - smart-run
          - telegram-find-chat
          - telegram-test

      shortcut_name:
        description: "Primary Dreame shortcut name"
        required: true
        default: "ניקוי עמוק"
        type: string

      shortcut_id:
        description: "Primary shortcut ID"
        required: false
        default: ""
        type: string

      fallback_shortcut_name:
        description: "Fallback shortcut name"
        required: false
        default: "שאיבה בלבד"
        type: string

      fallback_shortcut_id:
        description: "Fallback shortcut ID"
        required: false
        default: ""
        type: string

      water_empty_codes:
        description: "Clean-water error codes"
        required: false
        default: "107,116"
        type: string

permissions:
  contents: read

jobs:
  dreame:
    name: Dreame Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Dreame client
        run: npm install --no-save node-dreame@0.5.0

      - name: Dreame / Telegram operation
        env:
          DREAME_EMAIL: ${{ secrets.DREAME_EMAIL }}
          DREAME_PASSWORD: ${{ secrets.DREAME_PASSWORD }}
          DREAME_REGION: ${{ vars.DREAME_REGION || 'sg' }}
          DREAME_DEVICE_DID: ${{ vars.DREAME_DEVICE_DID }}
          DREAME_CAPTURE_SECONDS: ${{ vars.DREAME_CAPTURE_SECONDS || '150' }}

          DREAME_SHORTCUT_NAME: ${{ inputs.shortcut_name }}
          DREAME_SHORTCUT_ID: ${{ inputs.shortcut_id }}

          DREAME_FALLBACK_SHORTCUT_NAME: ${{ inputs.fallback_shortcut_name }}
          DREAME_FALLBACK_SHORTCUT_ID: ${{ inputs.fallback_shortcut_id }}
          DREAME_WATER_EMPTY_CODES: ${{ inputs.water_empty_codes }}
          DREAME_PRIMARY_GRACE_SECONDS: ${{ vars.DREAME_PRIMARY_GRACE_SECONDS || '12' }}
          DREAME_SMART_RUN_TIMEOUT_SECONDS: ${{ vars.DREAME_SMART_RUN_TIMEOUT_SECONDS || '100' }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_WATCH_SECONDS: ${{ vars.TELEGRAM_WATCH_SECONDS || '75' }}

        shell: bash
        run: |
          set -e

          MODE="${{ inputs.mode }}"
          SHORTCUT_NAME="${{ inputs.shortcut_name }}"
          SHORTCUT_ID="${{ inputs.shortcut_id }}"

          if [ "$MODE" = "telegram-find-chat" ]; then
            node scripts/telegram.mjs telegram-find-chat
            exit 0
          fi

          if [ "$MODE" = "telegram-test" ]; then
            node scripts/telegram.mjs telegram-test
            exit 0
          fi

          if [ "$MODE" = "smart-run" ]; then
            node scripts/smart-run.mjs
            exit 0
          fi

          if [ "$MODE" = "run-id" ]; then
            node scripts/telegram.mjs watch &
            WATCH_PID=$!
            sleep 2
            node scripts/dreame.mjs "$MODE" "$SHORTCUT_NAME" "$SHORTCUT_ID"
            wait "$WATCH_PID" || true
            exit 0
          fi

          node scripts/dreame.mjs "$MODE" "$SHORTCUT_NAME" "$SHORTCUT_ID"

