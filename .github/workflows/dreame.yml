name: Dreame X40 Shortcut

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Dreame / Telegram operation"
        required: true
        default: "capture"
        type: choice
        options:
          - capture
          - list
          - run-id
          - telegram-find-chat
          - telegram-test
      shortcut_name:
        description: "Dreame shortcut name"
        required: true
        default: "ניקוי עמוק"
        type: string
      shortcut_id:
        description: "Required only for run-id"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  dreame:
    name: Dreame Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Dreame client
        run: npm install --no-save node-dreame@0.5.0

      - name: Dreame / Telegram operation
        env:
          DREAME_EMAIL: ${{ secrets.DREAME_EMAIL }}
          DREAME_PASSWORD: ${{ secrets.DREAME_PASSWORD }}
          DREAME_REGION: ${{ vars.DREAME_REGION || 'sg' }}
          DREAME_DEVICE_DID: ${{ vars.DREAME_DEVICE_DID }}
          DREAME_CAPTURE_SECONDS: ${{ vars.DREAME_CAPTURE_SECONDS || '150' }}
          DREAME_SHORTCUT_NAME: ${{ inputs.shortcut_name }}
          DREAME_SHORTCUT_ID: ${{ inputs.shortcut_id }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_WATCH_SECONDS: ${{ vars.TELEGRAM_WATCH_SECONDS || '75' }}

        shell: bash
        run: |
          set -e

          MODE="${{ inputs.mode }}"
          SHORTCUT_NAME="${{ inputs.shortcut_name }}"
          SHORTCUT_ID="${{ inputs.shortcut_id }}"

          if [ "$MODE" = "telegram-find-chat" ]; then
            node scripts/telegram.mjs telegram-find-chat
            exit 0
          fi

          if [ "$MODE" = "telegram-test" ]; then
            node scripts/telegram.mjs telegram-test
            exit 0
          fi

          if [ "$MODE" = "run-id" ]; then
            # Start MQTT watcher BEFORE sending the cleaning command.
            node scripts/telegram.mjs watch &
            WATCH_PID=$!

            # Give MQTT a moment to subscribe.
            sleep 2

            # This script already treats Dreame 80001/no-ACK as non-fatal.
            node scripts/dreame.mjs "$MODE" "$SHORTCUT_NAME" "$SHORTCUT_ID"

            # Keep the job alive until start is confirmed or watcher times out.
            wait "$WATCH_PID" || true
            exit 0
          fi

          node scripts/dreame.mjs "$MODE" "$SHORTCUT_NAME" "$SHORTCUT_ID"
